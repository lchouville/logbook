<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logbook</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main id="app">
    <h1>Logbook</h1>
    <p>Journal de bord — en construction.</p>
    <section id="auth">
      <button id="sign-in" type="button">Se connecter avec Google</button>
      <button id="sign-out" type="button" hidden>Se déconnecter</button>
      <p id="auth-status">Non connecté.</p>
    </section>
    <section id="settings" hidden>
      <h2>Préférences</h2>
      <label for="theme-select">Thème</label>
      <select id="theme-select">
        <option value="device">Appareil</option>
        <option value="light">Clair</option>
        <option value="dark">Sombre</option>
      </select>
      <p id="settings-error" role="alert"></p>
    </section>
    <section id="entries" hidden>
      <h2>Nouvelle entrée</h2>
      <form id="entry-form">
        <label for="entry-themes">Thème(s)</label>
        <select id="entry-themes" multiple required></select>

        <label for="entry-niveau">Niveau d'accès</label>
        <select id="entry-niveau" required>
          <option value="" disabled selected>Choisir…</option>
        </select>

        <label for="entry-statut">Statut</label>
        <select id="entry-statut" required>
          <option value="" disabled selected>Choisir…</option>
        </select>

        <label for="entry-type-journee">Type de journée</label>
        <select id="entry-type-journee" required>
          <option value="" disabled selected>Choisir…</option>
        </select>

        <label for="entry-energie">Énergie (0-10)</label>
        <input id="entry-energie" type="number" min="0" max="10" step="0.5">

        <label for="entry-ressenti">Ressenti (0-10)</label>
        <input id="entry-ressenti" type="number" min="0" max="10" step="0.5">

        <label for="entry-texte">Texte</label>
        <textarea id="entry-texte" rows="4"></textarea>

        <button type="submit">Enregistrer</button>
      </form>
      <p id="entry-error" role="alert"></p>
      <h2>Entrées</h2>
      <ul id="entry-list"></ul>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
