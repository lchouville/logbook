<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logbook — partage</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main id="app">
    <h1>Logbook — tableau de bord partagé</h1>
    <section id="auth">
      <button id="sign-in" type="button">Se connecter avec Google</button>
      <button id="sign-out" type="button" hidden>Se déconnecter</button>
      <p id="auth-status">Non connecté.</p>
    </section>
    <section id="viewer" hidden>
      <button id="viewer-grant-access" type="button" hidden>Donner l'accès au fichier partagé</button>
      <p id="viewer-error" role="alert"></p>
      <ul id="viewer-list" class="card-list"></ul>
    </section>
    <footer>
      <a href="confidentialite.html">Politique de confidentialité</a>
    </footer>
  </main>
  <script type="module" src="js/partage.js"></script>
</body>
</html>
