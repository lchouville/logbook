name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-page]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Générer js/config.js depuis les secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
        run: |
          sed \
            -e "s|__GOOGLE_CLIENT_ID__|$GOOGLE_CLIENT_ID|" \
            -e "s|__GOOGLE_PICKER_API_KEY__|$GOOGLE_PICKER_API_KEY|" \
            js/config.template.js > js/config.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
