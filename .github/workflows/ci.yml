name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install html5validator
        run: pip install html5validator
      - name: Validate HTML
        run: html5validator --root . --match '*.html'

  no-tracking-files:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse visual-ref/ et REPRISE.md sur main
        run: |
          if [ -d visual-ref ] || [ -f REPRISE.md ]; then
            echo "visual-ref/ et REPRISE.md sont des fichiers de suivi internes, jamais publiés sur main." >&2
            exit 1
          fi
