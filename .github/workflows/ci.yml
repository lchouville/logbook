name: CI

on:
  pull_request:
    branches: [develop, release, gh-page]

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install html5validator
        run: pip install html5validator
      - name: Validate HTML
        run: html5validator --root . --match '*.html'
