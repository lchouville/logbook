<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="32" fill="#123a5e"/>

  <!-- Carnet (journal de bord), bas de la pastille, couvre aussi le coin bas-gauche -->
  <rect x="9" y="35" width="48" height="23" rx="4" fill="#0c2740"/>
  <rect x="8" y="33" width="48" height="23" rx="4" fill="#f4ede1" stroke="#0c2740" stroke-width="2"/>
  <line x1="32" y1="33" x2="32" y2="56" stroke="#0c2740" stroke-width="2.5" opacity="0.4"/>
  <polygon points="44,33 50,33 50,45 47,41 44,45" fill="#e8553e"/>

  <!-- Boussole, quart haut-gauche, zone propre -->
  <circle cx="20" cy="20" r="11" fill="#f4ede1" stroke="#123a5e" stroke-width="1.5"/>
  <polygon points="20,12.4 23,17 27.6,20 23,23 20,27.6 17,23 12.4,20 17,17" fill="#123a5e" opacity="0.85"/>
  <polygon points="20,12.4 23,17 20,20 17,17" fill="#e8553e"/>
  <circle cx="20" cy="20" r="1.7" fill="#d9a35c"/>

  <!-- Plume a ecrire, diagonale haut-droite vers centre, ne recouvre pas la boussole -->
  <g transform="translate(41,22) rotate(-50)">
    <polygon points="-15,0 -10,-1 -4,-5 6,-6 14,-2 15,0 14,2 6,6 -4,5 -10,1"
      fill="#f4ede1" stroke="#123a5e" stroke-width="2" stroke-linejoin="round"/>
    <line x1="-14" y1="0" x2="13" y2="0" stroke="#123a5e" stroke-width="1.5"/>
    <line x1="-8" y1="0" x2="-11" y2="-1.5" stroke="#123a5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="-5" stroke="#123a5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="4" y2="-5.5" stroke="#123a5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-11" y2="1.5" stroke="#123a5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="5" stroke="#123a5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="4" y2="5.5" stroke="#123a5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-15" y1="0" x2="-9" y2="0" stroke="#d9a35c" stroke-width="1.8"/>
    <polygon points="-15,0 -19,-1.8 -19,1.8" fill="#e8553e"/>
  </g>
</svg>
